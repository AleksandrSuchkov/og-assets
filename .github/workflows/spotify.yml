# Снимает историю прослушиваний Spotify и кладёт её в spotify/recent.json.
# Зачем здесь, а не на сервере блога: api.spotify.com с сентября 2026 отвечает российскому IP
# VDS «Spotify is unavailable in this country». Раннеры GitHub стоят в США — отсюда запрос
# проходит, а сервер блога читает готовый JSON с raw.githubusercontent.com, как и og-картинки.
# Секреты: SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, SPOTIFY_REFRESH_TOKEN (Settings → Secrets).
name: spotify-recent

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-recent
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch recently played
        env:
          CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          token=$(curl -sfS -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d grant_type=refresh_token -d "refresh_token=$REFRESH_TOKEN" \
            https://accounts.spotify.com/api/token | jq -r .access_token)
          mkdir -p spotify
          # Оставляем только поля, которые читает apps/server/src/spotify.ts в блоге,
          # чтобы файл и история репозитория не пухли.
          curl -sfS -H "Authorization: Bearer $token" \
            "https://api.spotify.com/v1/me/player/recently-played?limit=50" \
            | jq '{items: [.items[] | {
                played_at,
                track: {
                  id: .track.id,
                  name: .track.name,
                  duration_ms: .track.duration_ms,
                  external_urls: {spotify: .track.external_urls.spotify},
                  artists: [.track.artists[] | {id, name}],
                  album: {name: .track.album.name, images: [.track.album.images[] | {url, width}]}
                }}]}' > spotify/recent.json
          echo "items: $(jq '.items | length' spotify/recent.json), newest: $(jq -r '.items[0].played_at' spotify/recent.json)"

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- spotify/recent.json)" ]; then
            echo "no change"; exit 0
          fi
          git config user.name "spotify-recent"
          git config user.email "actions@users.noreply.github.com"
          git add spotify/recent.json
          git commit -q -m "spotify: recent tracks $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q
